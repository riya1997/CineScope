<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Storage</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="flex flex-col item-center">
    <div class="flex flex-col item-center p-6 b-1 mt-8 mr-16 font-17">
      <div>
        <input id="searchImput" class="mt-5 px-4 py-2 bg-green-500 hover:bg-blue-400 text-white rounded" type="text" placeholder="Search Fav Movie.." autocomplete="off">
        <button id="searchBtn" class="mt-3 px-4 py-2 bg-yellow-500 hover:bg-blue-400 text-white rounded">Search</button>
      </div>
      <div>
        <dialog id="myDialog" class="mt-5 px-4 py-2 bg-red-100 hover:bg-green-200 text-black rounded">
          <p id="dialogP"></p>
          <button commandfor="myDialog" command="close" class="mt-3 px-4 py-2 bg-yellow-500 hover:bg-blue-400 text-white rounded">Close</button>
        </dialog>
      </div>
      
    </div>
    
    <div class="container mx-auto p-4">
      <h1 class="text-3xl font-bold mb-4">Movie Cards</h1>
      <div
        id="movie-container"
        class="grid grid-cols-3 md:grid-cols-3 lg:grid-cols-5 gap-4"
      >
        <!-- Movie cards will be populated here -->
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
